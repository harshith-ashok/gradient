name: ci
on:
  push: {branches: [main]}
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: backend}}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run pytest -q
      - name: API contract is up to date
        run: |
          uv run python -m scripts.export_openapi
          git diff --exit-code openapi.json

  frontend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: frontend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
      - name: Generated client is up to date
        run: |
          npm run gen:api
          git diff --exit-code lib/api-client/schema.d.ts
      - run: npx next typegen && npm run typecheck
      - run: npm run lint

  e2e:
    # The whole stack on the fake model (no model server in CI), driven by a real browser.
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      LLM_PROVIDER: fake
      E2E_FAKE_AI: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json}
      - name: Start the stack
        run: docker compose -p gradient -f infra/docker-compose.yml up -d --build
      - name: Wait for the API
        run: |
          for i in $(seq 1 60); do curl -fsS http://localhost:8010/api/health/ready && exit 0; sleep 3; done
          docker compose -p gradient -f infra/docker-compose.yml logs backend worker | tail -80
          exit 1
      - run: uv sync
        working-directory: backend
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with: {name: playwright-traces, path: frontend/test-results}
      - if: failure()
        run: docker compose -p gradient -f infra/docker-compose.yml logs --tail=200
