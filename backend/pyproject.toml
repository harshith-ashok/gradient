[project]
name = "gradient-backend"
version = "0.1.0"
description = "Gradient API: adaptive learning platform backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "email-validator>=2.2",
  "pyjwt>=2.9",
  "argon2-cffi>=23.1",
  "redis>=5.0",
  "langgraph>=0.2",
  "httpx>=0.27",
  "pypdf>=7.0.1",
  "python-docx>=1.2.0",
  "pypdfium2>=5.15.2",
  "pillow>=13.0.0",
  "chromadb-client>=0.5",
  "python-multipart>=0.0.33",
  "openpyxl>=3.1.5",
  "docker>=7.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
    "reportlab>=5.1.0",
]

[tool.ruff]
line-length = 120
extend-exclude = ["alembic/versions"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: talks to the real model server (set LIVE_LLM=1 to run)"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.uv]
package = false
