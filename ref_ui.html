<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Study Path — Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0b0b0c;--panel:#161618;--panel2:#1f1f22;--panel3:#2a2a2e;--line:#2c2c31;--text:#ececef;--muted:#9c9ca5;--primary:#2f40c4;--primary-hi:#5566e8;--ok:#5fd394;--bad:#ff7b72;--lv0:#8f9bb3;--lv1:#5fa8ff;--lv2:#b58cff;--lv3:#f2c14e;--r:22px}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.5 "DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
:focus-visible{outline:2px solid var(--primary-hi);outline-offset:2px}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.lv0{--lvc:var(--lv0)}.lv1{--lvc:var(--lv1)}.lv2{--lvc:var(--lv2)}.lv3{--lvc:var(--lv3)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12.5px;background:var(--panel3);color:var(--muted);white-space:nowrap}
.chip[class*=" lv"],.chip.lv0,.chip.lv1,.chip.lv2,.chip.lv3{color:var(--lvc);background:color-mix(in srgb,var(--lvc) 15%,transparent)}
.chip.warn{color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent)}
.bar{height:6px;border-radius:99px;background:var(--panel3);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--lvc,var(--primary-hi))}
.pips{display:flex;gap:4px}.pips i{width:24px;height:6px;border-radius:3px;background:var(--panel3)}.pips i.on{background:var(--lvc)}
.icon-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.icon-btn:hover{background:var(--panel3);color:var(--text)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 20px;border-radius:999px;background:var(--panel3);font-weight:500}
.btn:hover{background:#34343a}
.btn.primary{background:var(--primary);color:#fff}.btn.primary:hover{background:var(--primary-hi)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.logo{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:500}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

.topbar{display:flex;align-items:center;gap:20px;padding:18px 28px;max-width:1236px;margin:0 auto}
.pills{display:flex;gap:6px;margin-left:12px}
.pill{padding:8px 16px;border-radius:999px;color:var(--muted)}
.pill[aria-pressed=true]{background:var(--panel2);color:var(--text)}
.grow{flex:1}
.search{display:flex;align-items:center;gap:10px;padding:0 18px;height:44px;width:min(380px,40vw);border:1px solid var(--line);border-radius:999px;color:var(--muted)}
.search input{background:none;border:0;outline:0;width:100%}
.layout-toggle{display:flex;background:var(--panel);border-radius:999px;padding:3px}
.layout-toggle button{width:36px;height:34px;border-radius:999px;display:grid;place-items:center;color:var(--muted)}
.layout-toggle button[aria-pressed=true]{background:var(--panel3);color:var(--text)}
.avatar{width:40px;height:40px;border-radius:50%;background:#6a3fd3;display:grid;place-items:center;font-weight:600}
.home{max-width:1180px;margin:0 auto;padding:0 28px 80px}
.sec-head{display:flex;align-items:center;justify-content:space-between;margin:34px 0 20px}
.sec-head h2{font-size:26px;font-weight:500}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px}
.card{background:var(--panel);border-radius:var(--r);padding:22px;text-align:left;display:flex;flex-direction:column;gap:10px;min-height:220px}
.card:hover{background:var(--panel2)}
.card-ic{width:44px;height:44px;border-radius:14px;background:var(--panel3);display:grid;place-items:center;color:var(--lv1)}
.card-title{font-size:20px;font-weight:500;margin-top:auto}
.card-meta{color:var(--muted);font-size:13.5px}
.card .chips{display:flex;flex-wrap:wrap;gap:6px}
.card-next{font-size:13.5px;color:var(--text)}
.cards.list{grid-template-columns:1fr}
.cards.list .card{flex-direction:row;align-items:center;min-height:0;gap:18px;flex-wrap:wrap}
.cards.list .card-title{margin-top:0;min-width:200px}
.empty{padding:60px 0;color:var(--muted);text-align:center}

.ws-top{display:flex;align-items:center;gap:14px;padding:12px 22px;height:68px}
.ws-top .title{font-size:20px;font-weight:500}
.ws-top .logo-btn{display:flex;align-items:center}
.ws-top .title{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nextup{margin-bottom:6px}
.mtabs{display:none}
.ws{display:grid;grid-template-columns:var(--cl,330px) minmax(0,1fr) var(--cr,350px);gap:14px;padding:0 14px 14px;height:calc(100vh - 68px)}
.ws[data-left=c]{--cl:64px}.ws[data-right=c]{--cr:64px}
.panel{background:var(--panel);border-radius:var(--r);display:flex;flex-direction:column;min-height:0;overflow:hidden}
.panel-head{display:flex;align-items:center;justify-content:space-between;padding:14px 14px 8px 22px;font-weight:500;font-size:16px}
.panel-body{overflow:auto;padding:4px 16px 18px;min-height:0;flex:1}
.ws[data-left=c] #p-sources .panel-body,.ws[data-left=c] #p-sources .t,.ws[data-right=c] #p-studio .panel-body,.ws[data-right=c] #p-studio .t{display:none}
.ws[data-left=c] #p-sources .panel-head,.ws[data-right=c] #p-studio .panel-head{padding:14px 10px;justify-content:center}
.btn-row{display:flex;gap:10px;margin-bottom:14px}
.btn-row .btn{flex:1;border:1px solid var(--line);background:transparent;padding:10px 12px}
.btn-row .btn:hover{background:var(--panel2)}
.sel-all{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:14px;padding:6px 4px}
.src{display:flex;align-items:center;gap:12px;padding:10px 6px;border-radius:12px;transition:background .3s}
.src.flash{background:color-mix(in srgb,var(--primary-hi) 30%,transparent)}
.src .nm{flex:1;min-width:0}
.src .nm b{display:block;font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.src .nm small{color:var(--muted);font-size:12.5px}
.src svg.i{color:#e8645a}
input[type=checkbox]{accent-color:var(--primary-hi);width:18px;height:18px}
.h-sub{font-size:13px;color:var(--muted);margin:20px 4px 8px}
.topic{display:block;width:100%;text-align:left;padding:12px;border-radius:14px;margin-bottom:6px;border:1px solid transparent}
.topic:hover{background:var(--panel2)}
.topic[aria-pressed=true]{background:var(--panel2);border-color:var(--line)}
.topic .row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.topic .row b{font-weight:500}
.topic small{display:block;color:var(--muted);font-size:12.5px;margin-top:6px}
.locked{opacity:.65}

.chat{background:var(--bg);position:relative}
.nextup{margin:6px auto 0;width:min(780px,calc(100% - 32px));background:var(--panel);border-radius:18px;padding:12px 16px;display:flex;gap:14px;align-items:center}
.nextup .tx{flex:1;min-width:0;font-size:14px}
.nextup .tx b{font-weight:600}
.nextup .tx span{color:var(--muted)}
.msgs{flex:1;overflow:auto;padding:18px 16px;min-height:0}
.msgs-in{width:min(780px,100%);margin:0 auto;display:flex;flex-direction:column;gap:18px}
.m-user{align-self:flex-end;background:var(--panel2);padding:12px 20px;border-radius:24px;max-width:85%}
.m-tutor{line-height:1.65}
.m-tutor p{margin-bottom:10px}
.m-tutor ul,.m-tutor ol{padding-left:22px;margin:8px 0 10px}
.m-tutor li{margin-bottom:6px}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip-btn{padding:8px 14px;border-radius:999px;border:1px solid var(--line);font-size:14px;color:var(--text)}
.chip-btn:hover{background:var(--panel2)}
.cite{display:inline-grid;place-items:center;min-width:20px;height:20px;border-radius:10px;background:var(--panel3);font-size:11.5px;color:var(--muted);margin:0 2px;padding:0 5px;vertical-align:1px}
.cite:hover{background:var(--primary-hi);color:#fff}
.dots{display:inline-flex;gap:5px}.dots i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:b 1s infinite}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.25}40%{opacity:1}}
.composer{width:min(780px,calc(100% - 32px));margin:0 auto 6px}
.sugg{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.cform{display:flex;align-items:center;gap:12px;background:var(--panel);border-radius:999px;padding:8px 10px 8px 24px}
.cform input{flex:1;background:none;border:0;outline:0;height:36px;min-width:0}
.cform small{color:var(--muted)}
.send{width:40px;height:40px;border-radius:50%;background:var(--panel3);display:grid;place-items:center}
.cform input:not(:placeholder-shown)~.send{background:var(--primary-hi)}
.foot-note{text-align:center;color:var(--muted);font-size:12.5px;padding:8px 0 10px}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
.tile{display:flex;align-items:center;gap:10px;padding:14px;border-radius:16px;background:var(--panel2);text-align:left}
.tile:hover{background:var(--panel3)}
.tile svg.i{color:var(--lv1)}
.tile.wide{grid-column:1/-1}
.art{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px;border-radius:14px}
.art:hover{background:var(--panel2)}
.art svg.i{color:var(--lv2)}
.art .nm{flex:1;min-width:0}
.art b{display:block;font-weight:500;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.art small{color:var(--muted);font-size:12.5px}
.hint{color:var(--muted);font-size:13.5px;padding:6px 4px}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,.62);display:grid;place-items:center;padding:20px;z-index:50}
.modal{background:#1b1b1e;border-radius:28px;width:min(760px,100%);max-height:calc(100vh - 40px);display:flex;flex-direction:column;outline:0}
.modal.wide{width:min(980px,100%)}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:22px 24px 6px 30px}
.modal-head h2{display:flex;align-items:center;gap:12px;font-size:22px;font-weight:500}
.modal-body{padding:10px 30px 24px;overflow:auto}
.modal-foot{display:flex;justify-content:flex-end;align-items:center;gap:12px;padding:16px 30px;border-top:1px solid var(--line)}
.modal-foot .grow{color:var(--muted);font-size:13.5px}
.field{margin-bottom:22px}
.field>label,.field>.lbl{display:block;color:var(--muted);margin-bottom:10px;font-size:15px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{padding:9px 18px;display:flex;align-items:center;gap:8px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed=true]{background:var(--panel3)}
.seg button[aria-pressed=true]::before{content:"✓"}
select,input[type=text],input[type=date]{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:11px 14px;min-width:260px}
.lvl-note{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:14px}
.drop{border:1.5px dashed var(--line);border-radius:20px;padding:34px 20px;display:grid;place-items:center;gap:6px;color:var(--muted);text-align:center;cursor:pointer}
.drop:hover,.drop.over{border-color:var(--primary-hi);background:var(--panel2)}
.files{margin-top:12px;display:flex;flex-direction:column;gap:6px}
.files div{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--panel2);border-radius:12px}

.prog{display:flex;align-items:center;gap:14px;margin-bottom:22px;color:var(--muted);font-size:14px}
.prog .bar{flex:1}
.qtext{font-size:21px;line-height:1.4;margin-bottom:22px;font-weight:500}
.opt{display:flex;gap:14px;width:100%;text-align:left;padding:15px 18px;border:1px solid var(--line);border-radius:16px;margin-bottom:10px;background:var(--panel2)}
.opt:hover:not(:disabled){border-color:var(--primary-hi)}
.opt:disabled{cursor:default}
.opt .k{width:26px;height:26px;border-radius:50%;background:var(--panel3);display:grid;place-items:center;font-size:13px;flex:none}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent)}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 13%,transparent)}
.expl{background:var(--panel2);border-radius:16px;padding:14px 18px;margin-top:6px;color:#d4d4da}
.fc-wrap{perspective:1200px;max-width:560px;margin:10px auto 18px}
.fc{position:relative;height:280px;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.2,.8,.2,1);cursor:pointer;width:100%;display:block}
.fc.flip{transform:rotateY(180deg)}
.fc .f{position:absolute;inset:0;backface-visibility:hidden;background:var(--panel2);border:1px solid var(--line);border-radius:24px;display:grid;place-items:center;padding:28px;text-align:center;font-size:19px;line-height:1.45}
.fc .b{transform:rotateY(180deg);background:color-mix(in srgb,var(--lv1) 12%,var(--panel2));font-size:17px}
.fc small{display:block;margin-top:14px;color:var(--muted);font-size:14px}
.center{display:flex;justify-content:center;align-items:center;gap:16px}
.score{display:flex;align-items:center;gap:26px;margin-bottom:22px;flex-wrap:wrap}
.ring{width:130px;height:130px;flex:none}
.big{font-size:26px;font-weight:600;line-height:1.2}
.move{display:flex;align-items:center;gap:12px;margin-top:12px;flex-wrap:wrap}
.card2{background:var(--panel2);border-radius:18px;padding:16px 18px;margin-bottom:12px}
.card2 h3{font-size:15px;font-weight:600;margin-bottom:8px}
.miss{border-top:1px solid var(--line);padding-top:10px;margin-top:10px;font-size:14px}
.miss b{font-weight:500}.miss span{color:var(--ok)}
.steps{counter-reset:s;list-style:none;padding:0;margin:0 0 14px}
.steps li{counter-increment:s;display:flex;gap:14px;padding:14px 16px;background:var(--panel2);border-radius:16px;margin-bottom:8px}
.steps li::before{content:counter(s);width:26px;height:26px;border-radius:50%;background:var(--primary);display:grid;place-items:center;font-size:13px;flex:none}
.day{display:grid;grid-template-columns:110px 1fr;gap:16px;padding:14px 0;border-bottom:1px solid var(--line)}
.day:last-child{border:0}
.day b{font-weight:600}.day small{color:var(--muted);display:block}
.day ul{margin:0;padding-left:18px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{color:var(--muted);font-weight:400;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:11px 10px;border-bottom:1px solid var(--line)}
.prow{display:grid;grid-template-columns:1.2fr 1.4fr 70px 1.4fr;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.prow:last-child{border:0}
svg.map text{fill:var(--text);font-family:inherit}
svg.map .node{cursor:pointer}
svg.map .node:hover circle.m{fill:var(--panel3)}
.srcs{color:var(--muted);font-size:13px;margin-top:16px}

.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:#2d2d33;padding:12px 20px;border-radius:14px;opacity:0;pointer-events:none;transition:.25s;z-index:80}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:980px){
  .topbar{flex-wrap:wrap;padding:14px 16px}.search{width:100%;order:5}.pills{margin-left:0}
  .home{padding:0 16px 60px}
  .ws-top{padding:10px 14px;gap:8px}.ws-top .title{font-size:18px}.hide-m,.ws-top .avatar{display:none}.ws-top .btn{padding:10px 12px}
  .ws{display:block;height:calc(100vh - 124px);padding:0 10px 10px}
  .ws .panel{height:100%}
  .ws[data-mtab=sources] #p-chat,.ws[data-mtab=sources] #p-studio,.ws[data-mtab=chat] #p-sources,.ws[data-mtab=chat] #p-studio,.ws[data-mtab=studio] #p-sources,.ws[data-mtab=studio] #p-chat{display:none}
  .ws .icon-btn.collapse{display:none}
  .mtabs{display:flex;gap:6px;padding:0 14px 10px}
  .mtabs button{flex:1;padding:10px;border-radius:999px;background:var(--panel);color:var(--muted)}
  .mtabs button[aria-pressed=true]{background:var(--panel3);color:var(--text)}
  .day{grid-template-columns:1fr;gap:6px}.prow{grid-template-columns:1fr 1fr}
  .modal-body{padding:8px 18px 18px}.modal-head{padding:18px 16px 4px 20px}.modal-foot{padding:14px 18px}
  select,input[type=text],input[type=date]{min-width:0;width:100%}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal-root"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const LEVELS = ['Beginner', 'Intermediate', 'Advanced', 'Expert'];
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let uid = 0;
const nid = () => 'id' + (++uid);
const DAY = 864e5;

const svg = p => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${p}</svg>`;
const I = {
  plus: svg('<path d="M12 5v14M5 12h14"/>'),
  close: svg('<path d="M6 6l12 12M18 6L6 18"/>'),
  send: svg('<path d="M12 19V5M6 11l6-6 6 6"/>'),
  back: svg('<path d="M19 12H5M11 6l-6 6 6 6"/>'),
  panel: svg('<rect x="4" y="4" width="16" height="16" rx="3"/><path d="M14 4v16"/>'),
  file: svg('<path d="M7 3h7l4 4v14H7z"/><path d="M14 3v4h4"/>'),
  lock: svg('<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>'),
  summary: svg('<path d="M5 4h14v16H5z"/><path d="M8 9h8M8 13h8M8 17h5"/>'),
  flashcards: svg('<rect x="3" y="7" width="13" height="11" rx="2"/><path d="M8 4h11a2 2 0 0 1 2 2v9"/>'),
  quiz: svg('<circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1 .9-1 1.7M12 17h.01"/>'),
  problems: svg('<path d="M4 20l5-5M9 15l2-6 6-5 3 3-5 6z"/>'),
  map: svg('<circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M8.5 11l7-4M8.5 13l7 4"/>'),
  plan: svg('<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/>'),
  progress: svg('<path d="M5 20V10M12 20V4M19 20v-7"/>'),
  upload: svg('<path d="M12 16V4M7 9l5-5 5 5M5 20h14"/>'),
  book: svg('<path d="M4 5a2 2 0 0 1 2-2h13v15H6a2 2 0 0 0-2 2z"/><path d="M4 20a2 2 0 0 0 2 2h13v-4"/><path d="M9 8h6"/>'),
  grid: svg('<rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/>'),
  list: svg('<path d="M4 7h16M4 12h16M4 17h16"/>'),
  search: svg('<circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4-4"/>')
};
const LOGO = '<svg width="30" height="30" viewBox="0 0 32 32" fill="none" stroke-linecap="round" aria-hidden="true"><path d="M4 25a12 12 0 0 1 24 0" stroke="#6b8cff" stroke-width="3"/><path d="M9 25a7 7 0 0 1 14 0" stroke="#8fa8ff" stroke-width="3"/><path d="M14 25a2 2 0 0 1 4 0" stroke="#b8c7ff" stroke-width="3"/></svg>';

/* ==== MOCK TUTOR DATA (stands in for the FastAPI + LangGraph backend) ==== */
const Q = (t, o, e) => ({ t, o, e });
const TOPIC_DEFS = {

/* ==== LEARNING LOGIC ==== */
function recommend(n) {
  const pool = n.topics.filter(t => !isLocked(n, t) && !isMastered(t)).sort((a, b) => mastery(a) - mastery(b));
  if (!pool.length) return null;
  const t = pool[0];
  const unlocks = n.topics.filter(x => tdef(x.id).prereq.includes(t.id) && isLocked(n, x));
  let reason = `${mastery(t)}% mastery, the lowest of your open topics`;
  if (unlocks.length) reason += `, and it unlocks ${unlocks.map(u => tdef(u.id).name).join(', ')}`;
  if (t.remediate) reason += '. Remediation was flagged after your last quiz';
  return { topic: t, reason };
}
function buildQuestions(topicId, level, count) {
  const order = [level];
  for (let d = 1; d < 4; d++) { if (level - d >= 0) order.push(level - d); if (level + d <= 3) order.push(level + d); }
  const out = [];
  for (const l of order) for (const q of QUESTIONS[topicId][l]) if (out.length < count) out.push({ ...q, level: l });
  return out.sort((a, b) => a.level - b.level).map(q => {
    const opts = shuffle(q.o.map((text, i) => ({ text, ok: i === 0 })));
    return { t: q.t, e: q.e, level: q.level, opts: opts.map(o => o.text), a: opts.findIndex(o => o.ok) };
  });
}
function applyProgression(n, topicId, score, total) {
  const t = topicOf(n, topicId), pct = Math.round(score / total * 100), before = t.level;
  let outcome, kind;
  if (pct >= 80) {
    t.remediate = false;
    if (t.level < 3) { t.level++; t.last = null; outcome = `Promoted to ${LEVELS[t.level]}`; kind = 'up'; }
    else { t.last = pct; outcome = 'Expert level maintained'; kind = 'hold'; }
  } else if (pct >= 50) { t.last = pct; t.remediate = false; outcome = 'Level held'; kind = 'hold'; }
  else if (t.level > 0) { t.level--; t.last = null; t.remediate = true; outcome = `Moved down to ${LEVELS[t.level]} for review`; kind = 'down'; }
  else { t.last = pct; t.remediate = true; outcome = 'Level held — remediation recommended'; kind = 'down'; }
  t.attempts++;
  n.history.push({ ts: Date.now(), topic: topicId, level: before, score, total, outcome });
  return { before, after: t.level, pct, outcome, kind };
}
function topicOrder(n) {
  return n.topics.slice().sort((a, b) => (isLocked(n, a) - isLocked(n, b)) || (mastery(a) - mastery(b)));
}
function buildPlan(n, examStr, minutes) {
  const days = Math.max(1, Math.min(14, Math.ceil((new Date(examStr + 'T00:00:00') - Date.now()) / DAY)));
  const order = topicOrder(n), out = [];
  for (let i = 0; i < days; i++) {
    const t = order[i % order.length], name = tdef(t.id).name, study = Math.round(minutes * .6), quiz = minutes - study;
    const date = Date.now() + i * DAY;
    if (days > 1 && i === days - 1) out.push({ date, tasks: [{ l: 'Mixed review across every topic', m: study }, { l: `Final quiz on your weakest topic: ${tdef(order[0].id).name}`, m: quiz }] });
    else out.push({ date, tasks: [{ l: `Study ${name} at ${LEVELS[t.level]} level (summary and flashcards)`, m: study }, { l: `Quiz: ${name}`, m: quiz }] });
  }
  return { exam: examStr, minutes, days: out };
}
const addDays = k => new Date(Date.now() + k * DAY).toISOString().slice(0, 10);
const readySources = n => n.sources.filter(s => s.checked && s.status === 'ready');
function cites(text, n) {
  return esc(text).replace(/\[(\d)\]/g, (m, i) => +i <= n.sources.length ? `<button class="cite" data-action="cite" data-src="${i}" aria-label="Source ${i}">${i}</button>` : '');
}

function makeArtifact(n, cfg, srcCount) {
  const base = { id: nid(), ts: Date.now(), srcCount, type: cfg.type };
  if (cfg.type === 'plan') {
    const plan = buildPlan(n, cfg.exam, +cfg.minutes);
    return { ...base, title: `Study plan · ${plan.days.length} days`, level: null, topic: null, data: plan };
  }
  const t = topicOf(n, cfg.topic), name = tdef(t.id).name, count = { fewer: 3, std: 4, more: 6 }[cfg.count || 'std'];
  if (cfg.type === 'quiz') return { ...base, title: `${name} quiz · ${LEVELS[t.level]}`, level: t.level, topic: t.id, data: { questions: buildQuestions(t.id, t.level, count) }, run: null, result: null };
  if (cfg.type === 'flashcards') return { ...base, title: `${name} flashcards · ${LEVELS[t.level]}`, level: t.level, topic: t.id, data: { cards: buildQuestions(t.id, t.level, count).map(q => ({ f: q.t, b: q.opts[q.a], e: q.e })) } };
  if (cfg.type === 'summary') return { ...base, title: `${name} summary · ${LEVELS[t.level]}`, level: t.level, topic: t.id, data: { paras: SUMMARY[t.id][t.level] } };
  return { ...base, title: `${name} problem guide`, level: t.level, topic: t.id, data: PROBLEMS[t.id], step: 0 };
}

/* ==== TUTOR (mock) ==== */
const actBtn = (type, topic, label) => `<button class="chip-btn" data-action="open-config" data-type="${type}" data-topic="${topic || ''}">${esc(label)}</button>`;
function tutorReply(text) {
  const n = nb(), q = text.toLowerCase();
  if (!readySources(n).length) return { html: 'Select at least one ready source in the Sources panel and I’ll answer from it.' };
  if (/plan|schedule/.test(q)) {
    const art = makeArtifact(n, { type: 'plan', exam: addDays(14), minutes: 30 }, readySources(n).length);
    n.artifacts.unshift(art); renderStudio();
    return { html: `I built a <b>${art.data.days.length}-day study plan</b> (30 min a day, exam in 14 days). It starts with <b>${tdef(topicOrder(n)[0].id).name}</b>, your weakest open topic, and ends with a mixed review.<div class="acts"><button class="chip-btn" data-action="open-art" data-id="${art.id}">Open the plan</button>${actBtn('plan', '', 'Change exam date')}</div>` };
  }
  if (/next|what should i|recommend|study today/.test(q)) {
    const r = recommend(n);
    if (!r) return { html: 'Every topic is at Expert level. Nothing left to unlock — nice work.' };
    const name = tdef(r.topic.id).name;
    return { html: `Study <b>${name}</b> next. ${esc(r.reason)}.<div class="acts">${actBtn('summary', r.topic.id, 'Read a summary')}${actBtn('quiz', r.topic.id, 'Take the quiz')}</div>` };
  }
  if (/quiz|test me/.test(q)) {
    const t = topicOf(n, n.focus), name = tdef(t.id).name;
    return { html: `I’ll match the questions to your <b>${LEVELS[t.level]}</b> level in <b>${name}</b>. Score 80% or more and you move up a level.<div class="acts">${actBtn('quiz', t.id, `Quiz me on ${name}`)}</div>` };
  }
  const hit = n.topics.find(t => tdef(t.id).kw.some(k => q.includes(k)));
  if (hit) {
    const d = tdef(hit.id), paras = SUMMARY[hit.id][hit.level];
    return { html: `<p>Explained at your <b>${LEVELS[hit.level]}</b> level for ${d.name}:</p><p>${cites(paras[0], n)}</p><p>${cites(paras[1], n)}</p><div class="acts">${actBtn('flashcards', hit.id, 'Make flashcards')}${actBtn('quiz', hit.id, 'Quiz me')}</div>` };
  }
  return { html: `I couldn’t find that in your selected sources, so I won’t guess. Try a topic from your material (${n.topics.map(t => tdef(t.id).name).join(', ')}), or add a source that covers it.` };
}
function send(text) {
  text = text.trim(); const n = nb(); if (!text) return;
  n.chat.push({ role: 'user', text }); n.chat.push({ role: 'tutor', typing: true });
  renderChat();
  setTimeout(() => {
    const idx = n.chat.findIndex(m => m.typing);
    if (idx > -1) n.chat[idx] = { role: 'tutor', ...tutorReply(text) };
    if (state.activeId === n.id) { renderChat(); renderStudio(); }
  }, 650);
}

    const [x, y] = pos[t.id], d = tdef(t.id), locked = isLocked(n, t);
    d.sub.forEach((s, i) => { const sx = x + off[i][0], sy = y + off[i][1]; g += `<line x1="${x}" y1="${y + 50}" x2="${sx}" y2="${sy - 13}" stroke="var(--line)" stroke-width="1.4"/><circle cx="${sx}" cy="${sy}" r="13" fill="var(--panel3)"/><text x="${sx}" y="${sy + 32}" text-anchor="middle" font-size="12" style="fill:var(--muted)">${s}</text>`; });
    g += `<g class="node" data-action="map-sel" data-id="${t.id}" tabindex="0" role="button" aria-label="${d.name}, ${LEVELS[t.level]}${locked ? ', locked' : ''}"><circle class="m" cx="${x}" cy="${y}" r="52" fill="var(--panel2)" stroke="${color(t)}" stroke-width="${sel === t.id ? 5 : 3}" ${locked ? 'stroke-dasharray="6 5"' : ''}/><text x="${x}" y="${y - 2}" text-anchor="middle" font-size="14" font-weight="600">${d.name}</text><text x="${x}" y="${y + 16}" text-anchor="middle" font-size="12" style="fill:${color(t)}">${locked ? 'Locked' : LEVELS[t.level]}</text></g>`;
  });
  const t = topicOf(n, sel), d = tdef(sel), locked = isLocked(n, t);
  showModal('Knowledge map', I.map, `<svg class="map" viewBox="0 0 700 270" role="img" aria-label="Topics, subtopics and prerequisites" style="width:100%;height:auto"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9c9ca5"/></marker></defs>${g}</svg>
    <div class="card2"><h3>${d.name}</h3><div class="move" style="margin:0 0 10px"><span class="chip lv${t.level}">${LEVELS[t.level]}</span><span class="chip">${mastery(t)}% mastery</span>${t.remediate ? '<span class="chip warn">Needs remediation</span>' : ''}</div>
    <p class="hint" style="padding:0">Subtopics: ${d.sub.join(', ')}.${d.prereq.length ? ' Requires ' + d.prereq.map(p => tdef(p).name).join(', ') + ' at Intermediate.' : ''}${locked ? ' This topic is locked until then.' : ''}</p></div>
    <p class="hint">Colour shows your level. Dashed circles are locked topics; arrows point from a prerequisite to the topic it unlocks.</p>`,
    locked ? '' : `<button class="btn primary" data-action="open-config" data-type="quiz" data-topic="${sel}">Quiz on ${d.name}</button>`, true);
}
function renderProgress() {
  const n = nb(), r = recommend(n);
  const rows = n.topics.map(t => { const d = tdef(t.id), m = mastery(t), locked = isLocked(n, t); return `<div class="prow lv${t.level}"><div><b>${d.name}</b><br><span class="chip lv${t.level}">${locked ? 'Locked' : LEVELS[t.level]}</span></div><div class="pips" aria-label="Level ${t.level + 1} of 4">${[0, 1, 2, 3].map(i => `<i class="${i <= t.level ? 'on' : ''}"></i>`).join('')}</div><b>${m}%</b><span class="hint" style="padding:0">${locked ? 'Needs ' + d.prereq.map(p => tdef(p).name).join(', ') + ' at Intermediate' : t.remediate ? 'Needs remediation' : isMastered(t) ? 'Mastered' : t.last == null ? 'Just reached this level' : 'Last score ' + t.last + '%'}</span></div>`; }).join('');
  const hist = n.history.slice().reverse();
  showModal('Progress & history', I.progress, `
    ${r ? `<div class="card2"><h3>Recommended next: ${tdef(r.topic.id).name}</h3><p class="hint" style="padding:0">${esc(r.reason)}.</p></div>` : ''}
    <h3 class="h-sub" style="font-weight:500">Levels by topic</h3>${rows}
    <h3 class="h-sub" style="font-weight:500">Quiz history (${hist.length})</h3>
    ${hist.length ? `<table><thead><tr><th>When</th><th>Topic</th><th>Level</th><th>Score</th><th>Result</th></tr></thead><tbody>${hist.map(h => `<tr><td>${ago(h.ts)}</td><td>${tdef(h.topic).name}</td><td><span class="chip lv${h.level}">${LEVELS[h.level]}</span></td><td>${h.score}/${h.total} (${Math.round(h.score / h.total * 100)}%)</td><td>${esc(h.outcome)}</td></tr>`).join('')}</tbody></table>` : '<p class="hint">No quizzes yet. Take one to place yourself.</p>'}`, '', true);
}

/* ==== EVENTS ==== */
const toastEl = $('#toast'); let toastT;
function toast(msg) { toastEl.textContent = msg; toastEl.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => toastEl.classList.remove('show'), 2200); }

const actions = {
  'home': () => { closeModal(); renderHome(); },
  'open-nb': d => openNotebook(d.id),
  'filter': d => { state.filter = d.v; renderHome(); },
  'layout': d => { state.layout = d.v; renderHome(); },
  'new-nb': () => { M = { view: 'newnb', title: 'Untitled notebook', files: [] }; renderModal(); focusModal(); },
  'nb-remove': d => { M.files.splice(+d.i, 1); renderModal(); },
  'nb-create': () => createNotebook(),
  'close-modal': () => closeModal(),
  'mtab': d => { $('#ws').dataset.mtab = d.v; document.querySelectorAll('.mtabs button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === d.v)); },
  'collapse': d => { const w = $('#ws'), k = d.side === 'left' ? 'left' : 'right'; w.dataset[k] = w.dataset[k] === 'c' ? '' : 'c'; },
  'add-src': () => $('#addSrc').click(),
  'focus': d => { nb().focus = d.id; renderSources(); renderChat(); },
  'suggest': d => send(d.text),
  'cite': d => { const el = $('#src-' + d.src); if (!el) return; const ws = $('#ws'); if (ws && getComputedStyle($('#p-sources')).display === 'none') ws.dataset.mtab = 'sources'; el.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); el.classList.add('flash'); setTimeout(() => el.classList.remove('flash'), 1400); },
  'open-config': d => openConfig(d.type, d.topic),
  'open-view': d => { M = { view: d.v, sel: null }; renderModal(); focusModal(); },
  'open-art': d => openArtifact(d.id),
  'cfg-count': d => { M.cfg.count = d.v; renderModal(); },
  'generate': () => generate(),
  'flip': () => { M.flip = !M.flip; renderModal(); },
  'card-prev': () => { M.card--; M.flip = false; renderModal(); },
  'card-next': () => { M.card++; M.flip = false; renderModal(); },
  'reveal': () => { const a = nb().artifacts.find(x => x.id === M.id); a.step++; renderModal(); },
  'pick': d => { const a = nb().artifacts.find(x => x.id === M.id); if (!a.run) a.run = { idx: 0, sel: null, answers: [] }; const r = a.run; if (r.sel != null) return; r.sel = +d.i; r.answers.push(+d.i === a.data.questions[r.idx].a); renderModal(); },
  'qnext': () => { const n = nb(), a = n.artifacts.find(x => x.id === M.id), r = a.run; if (r.idx === a.data.questions.length - 1) finishQuiz(a, n); else { r.idx++; r.sel = null; } renderModal(); },
  'remediate': () => { const n = nb(); remediate(n.artifacts.find(x => x.id === M.id), n); },
  'map-sel': d => { M.sel = d.id; renderModal(); }
};
const changes = {
  'sel-all': el => { nb().sources.forEach(s => { if (s.status === 'ready') s.checked = el.checked; }); renderSources(); renderChat(); },
  'src-toggle': el => { nb().sources.find(s => s.id === el.dataset.id).checked = el.checked; renderSources(); renderChat(); },
  'cfg-topic': el => { M.cfg.topic = el.value; renderModal(); },
  'cfg-exam': el => { if (el.value) M.cfg.exam = el.value; },
  'cfg-min': el => { M.cfg.minutes = +el.value; },
  'nb-title': el => { M.title = el.value; }
};
document.addEventListener('click', e => {
  if (e.target.matches('[data-overlay]')) { closeModal(); return; }
  const el = e.target.closest('[data-action]'); if (!el) return;
  const fn = actions[el.dataset.action]; if (fn) fn(el.dataset);
});
document.addEventListener('change', e => { const el = e.target.closest('[data-change]'); if (el && changes[el.dataset.change]) changes[el.dataset.change](el); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && M) closeModal();
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('g[data-action]')) { e.preventDefault(); e.target.dispatchEvent(new MouseEvent('click', { bubbles: true })); }
});

renderHome();
</script>
</body>
</html>
